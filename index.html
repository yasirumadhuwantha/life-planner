<!doctype html>
<!--
  Life Planner 1.0 is a standalone application. Styles, scripts, icons,
  photography and the favicon are embedded below. Google Fonts is optional;
  system fonts are used offline. Planner records stay in browser localStorage.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Life Planner · Your Personal Workspace</title>
    <meta
      name="description"
      content="A little space for your plans, finances, daily rituals and wellbeing. Your personal Life Planner."
    />
    <meta name="theme-color" content="#d9c6a6" />
    <!-- The favicon reuses the sidebar leaf mark and its gold background. -->
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2042%2042%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22gold%22%20cx%3D%2230%25%22%20cy%3D%2225%25%22%20r%3D%22100%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fff6c7%22%2F%3E%3Cstop%20offset%3D%2260%25%22%20stop-color%3D%22%23f3df86%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23e6c64e%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%2214%22%20fill%3D%22url%28%23gold%29%22%2F%3E%3Cg%20transform%3D%22translate%288%208%29%20scale%281.0833333333%29%22%20fill%3D%22none%22%20stroke%3D%22%23483807%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%203c-8-1-15%202-15%209a6%206%200%200%200%206%206c7%200%209-7%209-15Z%22%2F%3E%3Cpath%20d%3D%22M4%2021%2015%2010M10%2015v-5m0%205h5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
    />
    <!-- Shared theme, layout, responsive rules and embedded image assets. -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;650;700;750&display=swap");

      /* Theme tokens: dark defaults are overridden by body.light. Components share these variables. */
      :root {
        color-scheme: dark;
        --bg: #1b150f;
        --side: #251c15b8;
        --panel: #30261bba;
        --panel2: #fff0d612;
        --hover: #fff0d621;
        --stick: #30261ff5;
        --border: #ffeccd20;
        --border2: #ffeccd38;
        --text: #f7efe1;
        --sub: #cdbfa9;
        --accent: #c6ff3d;
        --accent2: #f1dc7e;
        --good: #9adba6;
        --warn: #f2c879;
        --bad: #f5a28c;
        --btn: #c6ff3d;
        --btn-text: #182000;
        --on: #182000;
        --ev: #f1dc7e;
        --evbg: #f1dc7e24;
        --ring: #c6ff3d26;
        --r: 22px;
        --glass-hi: #fff4de12;
        --rim: #ffeed22d;
        --glass-top: #fff6e447;
        --shadow: 0 1px 2px #0003, 0 20px 44px -30px #0009;
        --veil: linear-gradient(180deg, #100b0699, #0c0805ac);
        --tile1: #f1dc7e29;
        --tile2: #9adba624;
        --tile3: #fff0d612;
        --tile4: #eba07c24;
        --hl: #c8fa50;
        --hl-ink: #243105;
        --paper: #2d241a;
        --rail-width: 76px;
        --pad: 22px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.light {
        color-scheme: light;
        --bg: #cdb894;
        --side: #fdf7ec9e;
        --panel: #fff9ed99;
        --panel2: #fffcf666;
        --hover: #fffcf6ba;
        --stick: #f5eee1f5;
        --border: #3c280f1c;
        --border2: #3c280f30;
        --text: #2a2014;
        --sub: #6a5b4b;
        --accent: #2b2117;
        --accent2: #d4b13b;
        --good: #296c46;
        --warn: #855505;
        --bad: #a33724;
        --btn: #2b2117;
        --btn-text: #fbf3e2;
        --on: #fbf3e2;
        --ev: #765b12;
        --evbg: #e6c64e3b;
        --ring: #a3ce3d30;
        --glass-hi: #ffffff80;
        --rim: #fffaf0b8;
        --glass-top: #fffffff0;
        --shadow: 0 1px 2px #462c0e0c, 0 18px 40px -26px #462c0e5c;
        --veil: linear-gradient(180deg, #fff3de25, #f4e6cc64);
        --tile1: #f3df869e;
        --tile2: #bfe9b494;
        --tile3: #fffbf36b;
        --tile4: #ecd2b08c;
        --paper: #faf3e6;
      }
      /* Base typography, keyboard focus and the fixed photographic backdrop. */
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--border2) transparent;
      }
      html {
        scroll-behavior: smooth;
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          500 16px/1.5 Urbanist,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
        overflow-x: hidden;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          var(--veil),
          var(--scene-blur) center 55% / cover no-repeat;
        background-color: #b59a74;
        pointer-events: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: var(--accent);
      }
      [hidden] {
        display: none !important;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      ::selection {
        background: var(--ring);
      }
      small {
        font-size: 13px;
      }
      h1,
      h2,
      h3,
      p {
        overflow-wrap: break-word;
      }
      button {
        touch-action: manipulation;
      }
      .ico {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
        vertical-align: middle;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip {
        position: fixed;
        top: -80px;
        left: 20px;
        z-index: 100;
        background: var(--paper);
        padding: 12px 18px;
        border-radius: 12px;
      }
      .skip:focus {
        top: 10px;
      }
      .app {
        min-height: 100dvh;
        padding: 16px var(--pad) 122px calc(16px + var(--rail-width) + var(--pad));
        transition: padding-left 0.55s var(--ease);
      }
      .workspace {
        max-width: 1520px;
        margin: 0 auto;
        min-width: 0;
      }
      .pane,
      .panel,
      .metric {
        border: 1px solid var(--rim);
        background: linear-gradient(135deg, var(--glass-hi), transparent 55%), var(--panel);
        box-shadow:
          inset 1px 1px 0 var(--glass-top),
          var(--shadow);
      }
      .main {
        padding: 28px 22px 0;
        min-width: 0;
        width: 100%;
        margin: 0 auto;
      }
      .muted {
        color: var(--sub);
      }
      .accent {
        color: var(--accent);
      }
      .good {
        color: var(--good);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }

      /* The floating rail and its moving selection. */
      .rail {
        position: fixed;
        z-index: 32;
        top: 16px;
        bottom: 16px;
        left: 16px;
        width: var(--rail-width);
        border-radius: 28px;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(170deg, var(--glass-hi), transparent 40%), var(--side);
        backdrop-filter: blur(22px) saturate(130%);
        transition: width 0.55s var(--ease);
      }
      .brand {
        height: 52px;
        padding: 0 5px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
        background: none;
        border: 0;
        text-align: left;
        border-radius: 16px;
      }
      .brand-logo {
        height: 42px;
        width: 42px;
        flex: none;
        display: grid;
        place-items: center;
        color: #483807;
        border-radius: 14px;
        background: radial-gradient(circle at 30% 25%, #fff6c7, #f3df86 60%, #e6c64e);
        box-shadow:
          inset 0 -2px #785a0024,
          0 8px 18px -10px #7856008c;
      }
      .brand-logo .ico {
        width: 26px;
        height: 26px;
      }
      .brand-text {
        display: none;
        white-space: nowrap;
      }
      .brand-text strong {
        font-size: 21px;
        letter-spacing: -0.6px;
        display: block;
        line-height: 1.2;
      }
      .brand-text small {
        color: var(--sub);
        font-size: 12px;
      }
      .rail-toggle {
        align-self: center;
        margin: 8px 0 14px;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        border: 1px solid var(--border2);
        background: var(--panel2);
        display: grid;
        place-items: center;
      }
      .rail-toggle .ico {
        width: 17px;
      }
      .rail-nav {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 2px;
      }
      .rail-nav::-webkit-scrollbar {
        display: none;
      }
      .rail-link {
        height: 48px;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 13px;
        position: relative;
        z-index: 1;
        padding: 0 15px;
        border: 0;
        background: transparent;
        border-radius: 16px;
        color: var(--sub);
        text-align: left;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .rail-link:hover,
      .rail-link:focus-visible {
        background: var(--panel2);
        color: var(--text);
      }
      .rail-link .ico {
        height: 22px;
        width: 22px;
      }
      .rail-label {
        display: none;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 14px;
        font-weight: 600;
      }
      .rail-link.active {
        color: var(--hl-ink);
      }
      .rail-link .rail-chevron {
        position: absolute;
        right: 2px;
        top: 17px;
        width: 12px;
        height: 12px;
        opacity: 0.65;
      }
      .rail-pill {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(150deg, #dcff8b, var(--hl));
        box-shadow:
          inset 0 0 0 1px #50820022,
          0 8px 22px -13px #8cdc0099;
        transition:
          transform 0.5s var(--ease),
          opacity 0.2s;
        pointer-events: none;
      }
      .rail-sep {
        height: 1px;
        background: var(--border2);
        margin: 10px 12px;
        flex: none;
      }
      .rail-bottom {
        padding-top: 8px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #f3df86;
        color: #54411b;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 700;
        border: 2px solid #fff8;
      }
      .profile-btn {
        background: none;
        border: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px;
        min-height: 52px;
        text-align: left;
        border-radius: 14px;
      }
      .profile-btn:hover {
        background: var(--panel2);
      }
      .profile-copy {
        display: none;
        min-width: 0;
      }
      .profile-copy b {
        font-size: 14px;
        display: block;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      .profile-copy small {
        color: var(--sub);
        font-size: 12px;
      }
      body.rail-wide {
        --rail-width: 236px;
      }
      body.rail-wide .brand-text,
      body.rail-wide .rail-label,
      body.rail-wide .profile-copy {
        display: block;
      }
      body.rail-wide .rail-toggle {
        align-self: flex-end;
        margin-top: -43px;
        margin-bottom: 24px;
        margin-right: 4px;
      }
      body.rail-wide .rail-link .rail-chevron {
        position: static;
        margin-left: auto;
      }
      .flyout {
        position: fixed;
        z-index: 45;
        min-width: 235px;
        max-width: calc(100vw - 24px);
        padding: 8px;
        border-radius: 18px;
        background: linear-gradient(165deg, var(--glass-hi), transparent 40%), var(--paper);
        backdrop-filter: blur(24px);
        box-shadow:
          inset 0 0 0 1px var(--rim),
          0 18px 55px #29190630;
        animation: fly-in 0.25s var(--ease);
      }
      .flyout h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--sub);
        padding: 3px 10px;
        margin: 5px 0;
      }
      .flyout button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        background: none;
        border: 0;
        border-radius: 11px;
        font-size: 14px;
        text-align: left;
      }
      .flyout button:hover {
        background: var(--hover);
      }
      .flyout button.active {
        background: var(--hl);
        color: var(--hl-ink);
      }
      .flyout .ico {
        height: 18px;
        width: 18px;
      }

      /* Glass toolbar and workspace navigation. */
      .topnav {
        position: sticky;
        top: 14px;
        z-index: 30;
        height: 64px;
        padding: 0 12px 0 20px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(170deg, var(--glass-hi), transparent 46%), var(--side);
        backdrop-filter: blur(22px) saturate(130%);
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--sub);
        white-space: nowrap;
        min-width: 0;
      }
      .breadcrumb b {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .breadcrumb > .ico {
        width: 14px;
        height: 14px;
      }
      .search-trigger {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel2);
        border: 1px solid var(--rim);
        border-radius: 14px;
        padding: 0 10px 0 14px;
        width: min(330px, 30vw);
        height: 42px;
        color: var(--sub);
        font-size: 14px;
        text-align: left;
      }
      .search-trigger > span {
        flex: 1;
      }
      .kbd {
        font:
          600 12px Urbanist,
          system-ui;
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 1px 5px;
        background: var(--panel2);
      }
      .tools {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        display: inline-grid;
        place-items: center;
        color: var(--text);
        flex: none;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .icon-btn:hover {
        background: var(--hover);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .mobile-menu {
        display: none;
      }
      .tool-divider {
        height: 24px;
        width: 1px;
        background: var(--border);
        margin: 0 4px;
      }
      .planner-dock {
        position: fixed;
        z-index: 25;
        bottom: 14px;
        left: calc(16px + var(--rail-width) + var(--pad) + 22px);
        right: calc(var(--pad) + 22px);
        max-width: 1476px;
        margin: 0 auto;
        border-radius: 24px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        backdrop-filter: blur(24px) saturate(130%);
        background: linear-gradient(165deg, var(--glass-hi), transparent 46%), var(--side);
        transition: left 0.55s var(--ease);
      }
      .dock-item {
        height: 51px;
        min-width: 58px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        justify-content: center;
        align-items: center;
        background: var(--panel2);
        border: 1px solid var(--rim);
        border-radius: 15px;
        color: var(--sub);
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 600;
        transition:
          background 0.2s,
          transform 0.3s var(--ease);
      }
      .dock-item .ico {
        height: 20px;
        width: 20px;
      }
      .dock-item:hover {
        background: var(--hover);
        transform: translateY(-3px);
        color: var(--text);
      }
      .dock-item.active {
        background: var(--hl);
        color: var(--hl-ink);
        border-color: #50820030;
      }
      .dock-copy {
        margin-left: auto;
        padding: 0 12px;
        text-align: right;
        white-space: nowrap;
      }
      .dock-copy b {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .dock-copy small {
        color: var(--sub);
        font-size: 12px;
      }
      .mobile-dock {
        display: none;
      }

      /* Shared planner components. */
      .btn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        border: 1px solid var(--rim);
        border-radius: 12px;
        background: var(--panel2);
        color: var(--text);
        padding: 8px 15px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        transition:
          background 0.2s,
          box-shadow 0.2s,
          transform 0.25s var(--ease);
      }
      .btn .ico {
        width: 17px;
        height: 17px;
      }
      .btn:hover {
        background: var(--hover);
        box-shadow: 0 5px 15px -10px #32200d50;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(1px) scale(0.98);
      }
      .btn.primary {
        background: var(--btn);
        border-color: transparent;
        color: var(--btn-text);
        box-shadow: 0 10px 22px -14px #29210f70;
      }
      .btn.primary:hover {
        filter: brightness(1.1);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.sm {
        padding: 5px 11px;
        min-height: 32px;
        font-size: 13px;
        border-radius: 10px;
      }
      .titleline {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin: 10px 0 22px;
      }
      .titleline h1 {
        font-size: clamp(28px, 2.6vw, 38px);
        margin: 0 0 8px;
        letter-spacing: -0.04em;
        font-weight: 600;
        line-height: 1.12;
      }
      .subtitle {
        color: var(--sub);
        margin: 0;
        font-size: 15px;
        max-width: 73ch;
      }
      .eyebrow {
        display: block;
        color: var(--sub);
        font-size: 14px;
        margin-bottom: 9px;
      }
      .page-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .panel {
        padding: 20px;
        border-radius: var(--r);
        min-width: 0;
      }
      .panel + .panel {
        margin-top: 16px;
      }
      .panel h2 {
        font-size: 16px;
        font-weight: 650;
        margin: 0 0 4px;
        letter-spacing: -0.015em;
      }
      .panel h3 {
        font-size: 14px;
        font-weight: 650;
        margin: 12px 0;
      }
      .panel > .rowfill:first-child {
        margin-bottom: 15px;
        min-height: 28px;
      }
      .panel > .rowfill:first-child > h2 {
        margin: 0;
      }
      .panel > h2:first-child {
        margin: 0 0 18px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 0;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 18px;
      }
      .metric {
        padding: 17px 19px;
        border-radius: var(--r);
        min-height: 132px;
        background: var(--tile1);
        border-color: var(--rim);
        position: relative;
        overflow: hidden;
      }
      .metrics > .metric:nth-child(4n + 2) {
        background: var(--tile2);
      }
      .metrics > .metric:nth-child(4n + 3) {
        background: var(--tile3);
      }
      .metrics > .metric:nth-child(4n + 4) {
        background: var(--tile4);
      }
      .metric small {
        display: block;
        color: var(--sub);
        margin-bottom: 14px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        padding-right: 28px;
      }
      .metric strong {
        font-size: clamp(24px, 2.1vw, 32px);
        letter-spacing: -0.035em;
        font-weight: 600;
        overflow-wrap: anywhere;
        line-height: 1.2;
      }
      .metric em {
        display: block;
        font-size: 13px;
        color: var(--sub);
        font-style: normal;
        margin-top: 8px;
      }
      .metric-icon {
        position: absolute;
        right: 16px;
        top: 14px;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: var(--panel2);
        border-radius: 10px;
      }
      .metric-icon .ico {
        width: 17px;
        height: 17px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
        margin: 0 0 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 125px;
        flex: 1;
      }
      .field > label {
        font-size: 14px;
        font-weight: 600;
        color: var(--sub);
        text-transform: none;
        letter-spacing: 0;
      }
      .field input,
      .field select,
      .field textarea,
      .search {
        background: var(--panel2);
        border: 1px solid var(--border2);
        border-radius: 12px;
        padding: 10px 13px;
        color: var(--text);
        width: 100%;
        outline: none;
        min-height: 44px;
        font-size: 15px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .field input::placeholder,
      .search::placeholder {
        color: var(--sub);
        opacity: 0.8;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus,
      .search:focus {
        border-color: var(--accent2);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .field textarea {
        resize: vertical;
        min-height: 96px;
      }
      .field select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--sub) 50%),
          linear-gradient(135deg, var(--sub) 50%, transparent 50%);
        background-position:
          right 17px center,
          right 12px center;
        background-repeat: no-repeat;
        background-size: 5px 5px;
        padding-right: 34px;
      }
      select option {
        background: var(--paper);
        color: var(--text);
      }
      input[type="range"] {
        accent-color: var(--accent2);
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
        flex: none;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .line {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }
      .tablewrap {
        overflow: auto;
        width: 100%;
        max-height: 650px;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
        text-align: left;
      }
      .table thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--stick);
        color: var(--sub);
        font-size: 13px;
        font-weight: 600;
        padding: 13px 14px;
        white-space: nowrap;
        border-bottom: 1px solid var(--border);
      }
      .table tbody td {
        padding: 13px 14px;
        border-top: 1px solid var(--border);
        vertical-align: middle;
        max-width: 360px;
        font-size: 14px;
      }
      .table tbody tr:first-child td {
        border-top: 0;
      }
      .table tbody tr:hover {
        background: var(--panel2);
      }
      .table .actions {
        white-space: nowrap;
        text-align: right;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--evbg);
        color: var(--ev);
        border: 0;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pill.good-pill {
        color: var(--good);
        background: color-mix(in srgb, var(--good) 15%, transparent);
      }
      .pill.bad-pill {
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 13%, transparent);
      }
      .progress {
        height: 6px;
        background: var(--panel2);
        border-radius: 9px;
        overflow: hidden;
        min-width: 65px;
        margin-top: 9px;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 9px;
        transition: width 0.7s var(--ease);
      }
      .hint {
        font-size: 14px;
        color: var(--sub);
        line-height: 1.6;
      }
      .empty {
        text-align: center;
        padding: 28px 20px;
        color: var(--sub);
        border: 1px dashed var(--border2);
        border-radius: 14px;
        font-size: 14px;
      }
      .rowfill {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .notice {
        border: 1px solid var(--rim);
        background: var(--panel);
        border-radius: 16px;
        padding: 14px 18px;
        color: var(--sub);
        font-size: 14px;
        margin-bottom: 14px;
        line-height: 1.6;
      }
      .chart {
        width: 100%;
        height: 190px;
        display: block;
      }
      .tagbtn {
        background: transparent;
        border: 0;
        color: var(--accent);
        padding: 2px 0;
        font-weight: 650;
        font-size: 14px;
      }
      .checklist {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        font-size: 15px;
      }
      .scrollx {
        overflow: auto;
      }
      svg text {
        fill: var(--sub);
        font:
          13px Urbanist,
          system-ui;
      }
      .tabrow {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        padding: 4px;
        border-radius: 13px;
        background: var(--panel2);
        border: 1px solid var(--rim);
        width: fit-content;
        max-width: 100%;
      }
      .tab {
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--sub);
        padding: 8px 15px;
        font-size: 14px;
        font-weight: 600;
        transition:
          color 0.2s,
          background 0.25s;
      }
      .tab:hover {
        color: var(--text);
        background: var(--hover);
      }
      .tab.active {
        color: var(--hl-ink);
        background: var(--hl);
      }
      .tick {
        width: 28px;
        height: 28px;
        flex: none;
        display: inline-grid;
        place-items: center;
        background: var(--panel2);
        border: 1px solid var(--border2);
        border-radius: 8px;
        color: var(--text);
        padding: 0;
        font-size: 15px;
        transition:
          background 0.2s,
          transform 0.25s var(--ease),
          border-color 0.2s;
      }
      .tick:hover {
        border-color: var(--good);
        transform: scale(1.08);
      }
      .tick .ico {
        width: 16px;
        height: 16px;
      }
      .tick.on {
        background: var(--good);
        color: var(--paper);
        border-color: transparent;
      }
      .habit-table {
        border-collapse: collapse;
        min-width: 760px;
        width: 100%;
        font-size: 14px;
      }
      .habit-table th,
      .habit-table td {
        padding: 10px 5px;
        text-align: center;
        border-bottom: 1px solid var(--border);
      }
      .habit-table td:first-child,
      .habit-table th:first-child {
        position: sticky;
        left: 0;
        background: var(--stick) !important;
        min-width: 170px;
        text-align: left;
        z-index: 1;
      }

      /* Calendar views. */
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 7px;
      }
      .dayname {
        text-align: center;
        color: var(--sub);
        font-size: 13px;
        padding: 8px 0;
        font-weight: 600;
      }
      .day {
        min-height: 112px;
        border: 1px solid var(--border);
        background: var(--panel2);
        border-radius: 13px;
        text-align: left;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        overflow: hidden;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.25s var(--ease);
      }
      .day:hover {
        background: var(--hover);
        border-color: var(--border2);
        transform: translateY(-2px);
      }
      .day.out {
        opacity: 0.4;
      }
      .day.today {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .day .num {
        font-weight: 650;
        font-size: 14px;
      }
      .event {
        font-size: 12px;
        font-weight: 550;
        border-radius: 6px;
        padding: 3px 6px;
        background: var(--evbg);
        color: var(--ev);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .event.finance {
        color: var(--good);
        background: color-mix(in srgb, var(--good) 15%, transparent);
      }
      .event.health {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 15%, transparent);
      }
      .event.task {
        color: var(--text);
        background: var(--hover);
      }
      .weekdays {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }
      .weekcol {
        min-width: 0;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }
      .weekcol.today {
        border-color: var(--accent);
      }
      .weekcol h3 {
        font-size: 14px;
        margin: 0 0 12px;
        font-weight: 650;
      }
      .weekitem {
        padding: 9px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent2);
        font-size: 13px;
        border-radius: 9px;
        margin-bottom: 7px;
        overflow-wrap: anywhere;
      }

      /* Overview: photographic hero, task gauge and daily detail cards. */
      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 16px;
      }
      .sanctuary {
        min-height: 548px;
        border-radius: 24px;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: #a28f70 var(--scene) center/cover;
        box-shadow: var(--shadow);
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff8eb;
      }
      .sanctuary:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #1f180e10 35%, #1f180e90);
        z-index: -1;
      }
      .scene-tags {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .scene-tag {
        border: 1px solid #fff9;
        background: #fff8ebd9;
        backdrop-filter: blur(16px);
        color: #463a25;
        border-radius: 99px;
        padding: 6px 12px;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .scene-tag .ico {
        width: 15px;
        height: 15px;
      }
      .scene-tag:first-child {
        color: #245d3d;
      }
      .scene-bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
      }
      .scene-title {
        padding: 0 5px 5px;
        text-shadow: 0 2px 18px #20190f55;
      }
      .scene-title small {
        font-size: 13px;
        color: #fff4dfd9;
      }
      .scene-title h2 {
        font-size: clamp(24px, 2.3vw, 34px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        max-width: 13ch;
        font-weight: 500;
        margin: 9px 0 0;
      }
      .scene-summary {
        display: flex;
        gap: 24px;
        padding: 14px 17px;
        border: 1px solid #fff9;
        border-radius: 19px;
        color: #392d1c;
        background: #fbf3e2c9;
        backdrop-filter: blur(24px);
        box-shadow: 0 8px 24px -18px #20190f99;
      }
      .scene-summary small {
        display: block;
        color: #655746;
        font-size: 12px;
      }
      .scene-summary strong {
        display: block;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 600;
      }
      .scene-summary span {
        font-size: 12px;
        color: #655746;
      }
      .scene-hotspot {
        position: absolute;
        width: 24px;
        height: 24px;
        border: 5px solid #fff4c475;
        border-radius: 50%;
        padding: 0;
        background: #fff8df;
        box-shadow:
          0 0 0 5px #fff4c41a,
          0 4px 14px #35230c33;
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s;
      }
      .scene-hotspot:hover {
        transform: scale(1.18);
        box-shadow: 0 0 0 10px #fff4c42a;
      }
      .scene-hotspot:nth-of-type(1) {
        top: 43%;
        left: 56%;
      }
      .scene-hotspot:nth-of-type(2) {
        top: 63%;
        left: 28%;
      }
      .scene-hotspot:nth-of-type(3) {
        top: 30%;
        left: 83%;
      }
      .overview-side {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 16px;
      }
      .gauge-card {
        padding: 20px 19px 17px;
      }
      .card-caption {
        font-size: 13px;
        color: var(--sub);
        margin: 3px 0 0;
      }
      .gauge {
        position: relative;
        margin: 20px auto 13px;
        max-width: 280px;
        text-align: center;
      }
      .gauge svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .gauge-track {
        fill: none;
        stroke: var(--border);
        stroke-width: 18;
        stroke-linecap: round;
      }
      .gauge-arc {
        fill: none;
        stroke: #e6c64e;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - var(--value));
        transition: stroke-dashoffset 1.1s var(--ease);
      }
      .gauge-needle {
        transform: rotate(calc(-90deg + var(--value) * 1.8deg));
        transform-origin: 130px 135px;
        transition: transform 1.2s var(--ease);
      }
      .gauge-needle path {
        fill: var(--text);
      }
      .gauge-needle circle {
        fill: var(--paper);
        stroke: var(--text);
        stroke-width: 3;
      }
      .gauge-number {
        margin-top: -1px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1.1;
      }
      .gauge-number small {
        display: block;
        font-size: 12px;
        color: var(--sub);
        font-weight: 500;
        letter-spacing: 0;
        margin-top: 4px;
      }
      .mini-stats {
        display: flex;
        gap: 12px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 16px;
        justify-content: space-between;
      }
      .mini-stats > div {
        min-width: 0;
      }
      .mini-stats small {
        font-size: 12px;
        display: block;
        color: var(--sub);
        margin-bottom: 5px;
      }
      .mini-stats b {
        font-size: 14px;
        font-weight: 600;
      }
      .water-card {
        min-height: 190px;
      }
      .water-card .rowfill > b {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .water-meter {
        height: 13px;
        border-radius: 99px;
        background: var(--panel2);
        border: 1px solid var(--border);
        margin-top: 19px;
        overflow: hidden;
      }
      .water-meter i {
        display: block;
        height: 100%;
        width: var(--water);
        border-radius: inherit;
        background: linear-gradient(90deg, #c4eab8, #70b77d);
        transition: width 0.8s var(--ease);
      }
      .water-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 13px;
        color: var(--sub);
        font-size: 13px;
      }
      .water-footer button {
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        background: none;
        border: 0;
      }
      .overview-details {
        display: grid;
        grid-template-columns: 1fr 1fr 1.7fr;
        gap: 16px;
        margin-top: 16px;
      }
      .overview-details .panel {
        margin-top: 0;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .section-heading h2 {
        margin: 0;
      }
      .section-heading .icon-btn {
        height: 30px;
        width: 30px;
        background: var(--panel2);
        border: 1px solid var(--rim);
        border-radius: 10px;
      }
      .routine-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .routine-row:last-of-type {
        border: 0;
      }
      .routine-row > span {
        flex: 1;
      }
      .routine-row small {
        color: var(--sub);
        font-size: 12px;
        display: block;
      }
      .routine-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        font-size: 13px;
        color: var(--sub);
      }
      .goal-row {
        padding: 9px 0 12px;
      }
      .goal-row b {
        font-size: 14px;
        font-weight: 600;
      }
      .goal-row span {
        font-size: 13px;
        color: var(--sub);
      }
      .agenda-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
      }
      .agenda-row:last-child {
        border: 0;
      }
      .agenda-icon {
        width: 34px;
        height: 34px;
        background: var(--tile1);
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .agenda-icon .ico {
        height: 17px;
        width: 17px;
      }
      .agenda-text {
        flex: 1;
        min-width: 0;
      }
      .agenda-text b {
        font-size: 14px;
        display: block;
        font-weight: 600;
      }
      .agenda-text small {
        font-size: 12px;
        color: var(--sub);
      }
      .agenda-time {
        font-size: 13px;
        color: var(--sub);
        white-space: nowrap;
      }
      .overview-lower {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 16px;
      }
      .overview-lower .panel {
        margin-top: 0;
      }
      .finance-figure {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      .finance-caption {
        font-size: 13px;
        color: var(--sub);
      }
      .finance-bars {
        margin-top: 15px;
      }
      .finance-bars .chart {
        height: 170px;
      }
      .stat-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .stat-strip > div {
        background: var(--tile2);
        border: 1px solid var(--rim);
        border-radius: 15px;
        padding: 12px;
      }
      .stat-strip > div:nth-child(2) {
        background: var(--tile1);
      }
      .stat-strip > div:nth-child(3) {
        background: var(--tile3);
      }
      .stat-strip small {
        font-size: 12px;
        color: var(--sub);
        display: block;
      }
      .stat-strip b {
        font-weight: 600;
        display: block;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .meal-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .meal-row:last-child {
        border: 0;
      }
      .meal-row > div {
        flex: 1;
      }
      .meal-row b {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .meal-row small {
        color: var(--sub);
        font-size: 12px;
      }

      /* Drawers, search and keyboard access. */
      .modalbg {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #160e0959;
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fade 0.25s ease both;
      }
      .modalbg.closing {
        animation: fade 0.18s ease reverse both;
      }
      .modal {
        background: linear-gradient(165deg, var(--glass-hi), transparent 40%), var(--paper);
        border: 1px solid var(--rim);
        border-radius: 26px;
        width: min(620px, 100%);
        max-height: 90dvh;
        overflow: auto;
        padding: 24px;
        box-shadow:

      /* Page, chart and overlay motion. Reduced-motion overrides appear below the breakpoints. */
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fly-in {
        from {
          opacity: 0;
          transform: translateX(-8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        8%,
        90% {
          opacity: 1;
          transform: none;
        }
        100% {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes bar {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 6000;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @media print {
        body,
        body.light {
          background: #fff;
          color: #000;
          --text: #000;
          --sub: #444;
          --border: #ccc;
          --rim: #ccc;
          --stick: #f3f3f3;
          --panel: #fff;
          --panel2: #f7f7f7;
          --paper: #fff;
          --glass-hi: transparent;
          --tile1: #fff;
          --tile2: #fff;
          --tile3: #fff;
          --tile4: #fff;
        }
        body:before,
        .rail,
        .topnav,
        .planner-dock,
        .mobile-dock,
        .modalbg,
        .toast,
        .noprint,
        .scene-hotspot {
          display: none !important;
        }
        .app {
          padding: 0;
        }
        .main {
          padding: 0;
        }
        .panel,
        .metric {
          background: #fff;
          box-shadow: none;
          break-inside: avoid;
        }
        .sanctuary {
          min-height: 320px;
          print-color-adjust: exact;
        }
        .overview-grid {
          grid-template-columns: 1fr 260px;
        }
        .overview-details {
          grid-template-columns: 1fr 1fr;
        }
        .titleline .btn {
          display: none;
        }
        .overview-details > .panel:last-child {
          grid-column: 1/-1;
        }
      }

  <body>
    <a class="skip" href="#content">Skip to your planner</a>
    <div class="app">
      <!-- Persistent sidebar; navigation items and the active pill are rendered by JavaScript. -->
      <aside class="rail pane" aria-label="Planner navigation">
        <button class="brand" onclick="changePage('dashboard')" aria-label="Life Planner overview">
          <span class="brand-logo" id="brand-mark"></span>
          <span class="brand-text">
            <strong>Life Planner</strong>
            <small>Your Personal Workspace</small>
          </span>
        </button>
        <button
          class="rail-toggle"
          id="rail-toggle"
          onclick="toggleRail()"
          title="Expand or collapse sidebar ["
          aria-label="Expand or collapse sidebar"
          aria-expanded="false"
        ></button>
        <nav class="rail-nav" id="nav" aria-label="Planner sections"></nav>
        <div class="rail-bottom">
          <button
            class="rail-link"
            id="settings-nav"
            onclick="changePage('setup')"
            title="Setup & lists"
            aria-label="Setup & lists"
          >
            <span id="settings-icon"></span>
            <span class="rail-label">Setup & Lists</span>
          </button>
          <button
            class="profile-btn"
            onclick="openAccount()"
            title="Your planner & backups"
            aria-label="Your planner & backups"
          >
            <span class="avatar" id="profile-initials">LP</span>
            <span class="profile-copy">
              <b id="profile-name">Your workspace</b>
              <small>A little space for you</small>
            </span>
          </button>
        </div>
      </aside>
      <div class="workspace">
        <!-- Workspace toolbar: search, new entries, theme and backup controls. -->
        <header class="topnav pane" id="topnav">
          <button
            class="icon-btn mobile-menu"
            onclick="openAllTools()"
            title="All planner tools"
            aria-label="All planner tools"
            id="mobile-menu-icon"
          ></button>
          <div class="breadcrumb">
            <span>Life Planner</span>
            <span id="crumb-chevron"></span>
            <b id="crumb">Dashboard</b>
          </div>
          <button
            class="search-trigger"
            onclick="openSearch()"
            aria-label="Search your planner (Ctrl+K)"
          >
            <span id="search-icon"></span>
            <span>Search your planner…</span>
            <kbd class="kbd">⌘K</kbd>
          </button>
          <div class="tools">
            <button
              class="btn primary new-trigger"
              onclick="openNewEntry()"
              aria-label="Add a new entry"
            >
              <span id="new-icon"></span>
              <span>New</span>
            </button>
            <span class="tool-divider"></span>
            <button
              class="icon-btn"
              id="theme-toggle"
              onclick="toggleTheme()"
              aria-label="Switch theme"
            ></button>
            <button
              class="icon-btn backup-tool"
              id="backup-tool"
              onclick="backup()"
              title="Download JSON backup"
              aria-label="Download JSON backup"
            ></button>
            <button
              class="icon-btn"
              id="all-tools-button"
              onclick="openAllTools()"
              title="All planner tools"
              aria-label="Browse all planner tools"
            ></button>
          </div>
        </header>
        <!-- Page renderers replace #content; the surrounding navigation stays mounted. -->
        <main class="main"><div id="content" tabindex="-1"></div></main>
      </div>
      <!-- Desktop shortcuts and the compact mobile navigation share the same page state. -->
      <nav class="planner-dock pane" id="desktop-dock" aria-label="Workspace shortcuts"></nav>
      <nav class="mobile-dock pane" id="mobile-dock" aria-label="Workspace shortcuts"></nav>
    </div>
    <!-- Backup import uses a local file picker; the file is never uploaded. -->
    <input
      type="file"
      accept=".json,application/json"
      id="restore"
      hidden
      onchange="restoreFile(event)"
    />
    <!-- Overlay roots are outside the layout so menus, dialogs and announcements can float above it. -->
    <div id="flyoutroot"></div>
    <div id="modalroot"></div>
    <div id="toastroot" role="status" aria-live="polite"></div>
    <!-- Application data, record editors, page renderers and workspace interactions. -->

        for (const key of ["habitChecks", "choreChecks", "groceryAutoChecks"])
          if (state[key])

        update();
        toast("Sample data removed. Your own entries are safe.");

            const ids = new Set((state[key] || []).map((x) => x.id));
            state[key] ??= [];

      // Build the record form from its schema; saving delegates the collection-specific mutation to onSave.
      function modal(titleText, fields, values = {}, onSave) {
        dialogReturnFocus = document.activeElement;
        const fieldsHtml = fields
          .map((f) => {
            let val =
              values[f.key] ?? (typeof f.default === "function" ? f.default() : (f.default ?? ""));
            let options = typeof f.options === "function" ? f.options() : f.options || [];
            const attrs =
              (f.min !== undefined ? `min="${f.min}" ` : "") +
              (f.max !== undefined ? `max="${f.max}" ` : "") +
              (f.step !== undefined ? `step="${f.step}" ` : "");
            let control =
              f.type === "textarea"
                ? `<textarea name="${f.key}" rows="3">${esc(val)}</textarea>`
                : f.type === "select"
                  ? `<select name="${f.key}"><option value="">— Choose —</option>${options.map((o) => `<option value="${esc(typeof o === "object" ? o.value : o)}" ${String(val) === String(typeof o === "object" ? o.value : o) ? "selected" : ""}>${esc(typeof o === "object" ? o.label : o)}</option>`).join("")}</select>`
                  : f.type === "checkbox"
                    ? `<input type="checkbox" name="${f.key}" ${val ? "checked" : ""} style="width:18px;min-height:18px">`
                    : `<input type="${f.type || "text"}" name="${f.key}" value="${esc(val)}" ${attrs}>`;
            return `<div class="field ${f.type === "textarea" ? "wide" : ""}"><label>${esc(f.label)}</label>${control}</div>`;
          })
          .join("");
        $("modalroot").innerHTML =
          `<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">${esc(titleText)}</h2><button type="button" class="icon-btn" onclick="closeModal()" aria-label="Close dialog">${icon("close")}</button></div><form id="recordform"><div class="formgrid">${fieldsHtml}</div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save changes</button></div></form></div></div>`;
        $("recordform").onsubmit = (e) => {
          e.preventDefault();
          let out = {};
          for (let f of fields) {
            let input = e.target.elements.namedItem(f.key);
            out[f.key] =
              f.type === "checkbox"
                ? input.checked
                : f.type === "number"
                  ? num(input.value)
                  : input.value;
          }
          onSave(out);
          closeModal();
          update();
        };
        prepareDialog();

      function closeModal() {
        const bg = document.querySelector("#modalroot .modalbg");
        if (!bg) return;
        const restore = () => {
          if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
          else $("content").focus({ preventScroll: true });
        };
        if (REDUCED()) {
          bg.remove();
          restore();
          return;
        }
        if (bg.classList.contains("closing")) return;
        bg.classList.add("closing");
        setTimeout(() => {
          if (bg.isConnected && bg.classList.contains("closing")) {
            bg.remove();
            restore();
          }
        }, 190);

        let old = state[kind].find((x) => x.id === id) || {};

      // JSON backups preserve the complete state. CSV exports are flat tables for external tools.
      function download(name, content, mime) {
        let blob = new Blob([content], { type: mime }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }
      function backup() {
        download(
          "life-planner-backup-" + TODAY() + ".json",
          JSON.stringify(
            {
              format: "life-planner-html",
              version: 1,
              savedAt: new Date().toISOString(),
              data: state,
            },
            null,
            2,
          ),
          "application/json",
        );
      }
      function restoreFile(e) {
        let file = e.target.files[0];
        if (!file) return;
        file.text().then((t) => {
          try {
            let v = JSON.parse(t);
            let data = v.data || v;
            if (!Array.isArray(data.tasks) || !data.settings) throw Error("Invalid planner backup");
            if (confirm("Restore backup? Current browser data will be replaced.")) {
              state = Object.assign(seed(), data);
              state.settings = Object.assign(seed().settings, data.settings);
              update();
              toast("Backup restored");
            }
          } catch (err) {
            alert("Could not restore: " + err.message);
          }
          e.target.value = "";
        });
      }
      function exportCSV(kind) {
        let rows = state[kind] || [];
        let keys = [...new Set(rows.flatMap((x) => Object.keys(x)))];
        let csv = [
          keys.join(","),
          ...rows.map((r) =>
            keys.map((k) => '"' + String(r[k] ?? "").replaceAll('"', '""') + '"').join(","),
          ),
        ].join("\r\n");
        download(kind + ".csv", csv, "text/csv");
      }

      // Charts are generated as inline SVG so they work offline without a charting dependency.
      function barChart(labels, values) {
        let max = Math.max(1, ...values.map((x) => Math.abs(x)));
        let w = 540,
          h = 190,
          barw = 440 / Math.max(labels.length, 1);
        return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="42" y1="157" x2="522" y2="157" stroke="var(--border)"/>${values
          .map((v, i) => {
            let ht = Math.max(1, (Math.abs(v) / max) * 118);
            return `<rect x="${55 + i * barw}" y="${157 - ht}" width="${Math.max(5, barw * 0.55)}" height="${ht}" rx="7" fill="${v < 0 ? "var(--bad)" : i % 3 === 0 ? "#8dbb85" : i % 3 === 1 ? "#e6c64e" : "#b6a080"}"/><text x="${55 + i * barw + barw * 0.25}" y="175" text-anchor="middle">${esc(labels[i]).slice(0, 10)}</text><text x="${55 + i * barw + barw * 0.25}" y="${152 - ht}" text-anchor="middle">${fmt(v)}</text>`;
          })
          .join("")}</svg>`;
      }
      function lineChart(rows, formatter = (x) => fmt(x)) {
        if (!rows.length) return empty("Add entries to see the trend.");
        let vals = rows.map((x) => x[1]),
          min = Math.min(...vals),
          max = Math.max(...vals);
        if (max === min) max = min + 1;
        let pts = rows.map((r, i) => [
          38 + (i / Math.max(1, rows.length - 1)) * 476,
          153 - ((r[1] - min) / (max - min)) * 117,
        ]);
        return `<svg class="chart" viewBox="0 0 540 185" preserveAspectRatio="none"><line x1="35" y1="154" x2="520" y2="154" stroke="var(--border)"/><polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--good)"><title>${esc(rows[i][0])}: ${formatter(vals[i])}</title></circle>`).join("")}<text x="35" y="173">${esc(rows[0][0])}</text><text x="518" y="173" text-anchor="end">${esc(rows.at(-1)[0])}</text><text x="35" y="20">${esc(formatter(max))}</text></svg>`;

      // Finance pages calculate summaries from records; no separate totals are persisted.

      let debtStrategy = "snowball",
        extraDebt = 0;
      // Simulate copied balances, paying minimums before strategy-ordered extras. Stop after 600 months.
      function debtSim() {
        let debts = state.debts.map((d) => ({
            ...d,
            balance: Math.max(0, num(d.balance)),
            rate: num(d.apr) / 1200,
            min: num(d.minimum),
          })),
          payoffs = {},
          history = [],
          interest = 0,
          monthlyMin = sum(debts, "min");
        if (!debts.length)
          return { history, interest, payoffs, months: 0, min: 0, unpayable: false };
        let unpayable = false;
        for (let month = 1; month <= 600; month++) {
          if (debts.every((d) => d.balance <= 0.005)) break;
          let remaining = monthlyMin + Math.max(0, num(extraDebt)),
            active = debts.filter((d) => d.balance > 0.005),
            rateInterest = 0;
          active.forEach((d) => {
            let x = d.balance * d.rate;
            d.balance += x;
            rateInterest += x;
          });
          interest += rateInterest;
          let paid = 0;
          for (let d of active) {
            let payment = Math.min(d.balance, Math.min(d.min, remaining));
            d.balance -= payment;
            remaining -= payment;
            paid += payment;
            if (d.balance <= 0.005) {
              d.balance = 0;
              payoffs[d.id] = month;
            }
          }
          let ordering = active
            .filter((d) => d.balance > 0.005)
            .sort((a, b) =>
              debtStrategy === "snowball" ? a.balance - b.balance : b.rate - a.rate,
            );
          for (let d of ordering) {
            if (remaining <= 0.005) break;
            let payment = Math.min(d.balance, remaining);
            d.balance -= payment;
            remaining -= payment;
            paid += payment;
            if (d.balance <= 0.005) {
              d.balance = 0;
              payoffs[d.id] = month;
            }
          }
          history.push([month, sum(debts, "balance")]);
          if (paid < 0.005) {
            unpayable = true;
            break;
          }
        }
        if (history.length === 600 && history.at(-1)[1] > 0.005) unpayable = true;
        return { history, interest, payoffs, months: history.length, min: monthlyMin, unpayable };
      }
      function debts() {
        let s = debtSim(),
          total = sum(state.debts, "balance");
        return (
          title(

            `<div class="toolbar"><div class="field"><label>Payoff strategy</label><select onchange="debtStrategy=this.value;render()"><option value="snowball" ${debtStrategy === "snowball" ? "selected" : ""}>Snowball · smallest balance first</option><option value="avalanche" ${debtStrategy === "avalanche" ? "selected" : ""}>Avalanche · highest APR first</option></select></div><div class="field"><label>Extra monthly payment</label><input type="number" min="0" step=".01" value="${extraDebt}" onchange="extraDebt=Math.max(0,Number(this.value)||0);render()"></div></div><p class="hint">Minimum payments are assumed to be a fixed monthly budget. Amounts freed by paid-off debts are redirected to remaining debts. Interest is estimated monthly at APR ÷ 12; results exclude fees, penalties, changing interest rates and payment timing.</p>`,
          ) +
          `<div class="grid two" style="margin-top:16px">${panel(
            "Debt list",
            `<div class="toolbar">${btn("Add debt", "editRecord('debts')")}</div>` +
              table(
                [
                  ["Debt", "name"],
                  ["Principal", (r) => cash(r.balance)],
                  ["APR", (r) => fmt(r.apr) + "%"],
                  ["Minimum", (r) => cash(r.minimum)],

                ],
                state.debts,

        return String(goal.steps || "")

          ? row.replace(/^\[x\]\s*/i, "[ ] ")

      // Derive shopping items from the selected week; combine quantities only when name and unit match.
      function inferredGrocery() {
        let start = mondayOf(selectedDate),
          end = dayAdd(start, 6),
          plan = state.mealplans.filter((x) => x.date >= start && x.date <= end),
          aggregate = new Map();
        for (let m of plan) {
          let recipe = state.recipes.find((x) => x.id === m.recipe);
          if (!recipe) continue;
          for (let row of String(recipe.ingredients || "").split("\n")) {
            let [name, qty, unit] = row.split("|").map((x) => x?.trim() || "");
            if (!name) continue;
            qty = num(qty) || 1;
            unit =
              unit ||
              state.ingredients.find((x) => x.name.toLowerCase() === name.toLowerCase())?.unit ||
              "each";
            let key = (name + "|" + unit).toLowerCase(),
              safeId =
                "item" +
                Array.from(key)
                  .map((ch) => ch.codePointAt(0).toString(16))
                  .join(""),
              known = state.ingredients.find((x) => x.name.toLowerCase() === name.toLowerCase());
            if (!aggregate.has(key))
              aggregate.set(key, {
                id: safeId,
                name,
                qty: 0,
                unit,
                category: known?.category || "Other",
                auto: true,
              });
            aggregate.get(key).qty += qty;
          }
        }
        return [...aggregate.values()];
      }

      function showRailGroup(index, button, focus = false) {

ed</small><b>${complete} tasks</b></div><div><small>Still to do</small><b>${open.length} tasks</b></div><div><small>Total</small><b>${state.tasks.length} tasks</b></div></div></section><section class="panel water-card"><div class="rowfill"><div><h2>A moment to hydrate</h2><p class="card-caption">A little care goes a long way</p></div><b>${waterPercent}%</b></div><div class="water-meter" style="--water:${waterPercent}%" role="progressbar" aria-label="Daily hydration" aria-valuenow="${waterPercent}" aria-valuemin="0" aria-valuemax="100"><i></i></div><div class="water-footer"><span>${fmt(water)} of ${fmt(waterGoal)} mL</span><button onclick="quickWater()">${icon("plus")}250 mL</button></div><div class="mini-stats"><div><small>Remaining</small><b>${fmt(Math.max(0, waterGoal - water))} mL</b></div><div><small>Today’s drinks</small><b>${byDate(state.hydration, today).length} logged</b></div><button class="icon-btn" onclick="changePage('hydration')" title="Open hydration tracker" aria-label="Open hydration tracker">${icon("water")}</button></div></section></div></div>` +

            )
            .join("") +
            '<div class="line"></div><div class="inline"><button class="btn" onclick="backup()">' +
            icon("download") +
            'Backup</button><button class="btn" onclick="document.getElementById(\'restore\').click()">' +
            icon("upload") +
            "Restore</button></div>",
        );
      }
      function openAccount() {
        showDialog(
          "Make yourself at home",
          `<p class="hint">${state.settings.name ? "Your planner, " + esc(state.settings.name) + "." : "A personal space for your plans and progress."} Changes save automatically in this browser.</p><div class="pages-group account-actions"><button class="result-btn" onclick="changePage('setup')">${icon("settings")}<span>Setup & personalization<small>Your name, currency, lists and preferences</small></span>${icon("chevron")}</button><button class="result-btn" onclick="backup()">${icon("download")}<span>Download a backup<small>Keep a copy of all your planner data</small></span></button><button class="result-btn" onclick="document.getElementById('restore').click()">${icon("upload")}<span>Restore a backup<small>Import your existing planner JSON</small></span></button><button class="result-btn" onclick="toggleTheme()">${icon(state.settings.theme === "light" ? "moon" : "sun")}<span>Switch to ${state.settings.theme === "light" ? "dark" : "light"} theme</span></button><button class="result-btn" onclick="closeModal();window.print()">${icon("print")}<span>Print this view</span></button></div>`,
        );
      }
      function openSearch() {
        showDialog(
          "Find your flow",
          `<div class="quick-search">${icon("search")}<input id="workspace-search" type="search" aria-label="Search your planner" placeholder="Search tools, tasks, goals…" autocomplete="off" oninput="renderSearch(this.value)"><kbd class="kbd">Esc</kbd></div><div id="search-results" class="search-results"></div><div class="search-foot"><span>Tools & entries from your planner</span><span>↑ ↓ to browse · Enter to open</span></div>`,
          true,
        );
        renderSearch("");
        $("workspace-search").focus();
      }

      // Search tools and selected saved collections locally; record titles keep their authored capitalization.
      function renderSearch(query) {
        const q = query.toLowerCase().trim();
        let rows = allPlannerPages()
          .filter(([id, _, name]) => [name, id].join(" ").toLowerCase().includes(q))
          .map(([id, _, name]) => ({
            ico: PAGE_ICONS[id],
            title: tcase(name),
            detail: "Planner tool",
            action: `changePage('${id}')`,
          }));
        if (q) {
          for (const [kind, ico, label] of [
            ["tasks", "tasks", "Task"],
            ["goals", "target", "Goal"],
            ["habits", "habits", "Habit"],
            ["recipes", "meals", "Recipe"],
            ["notes", "note", "Note"],
          ])
            for (const r of state[kind])
              if (
                [r.name, r.title, r.description, r.text]
                  .filter(Boolean)
                  .join(" ")
                  .toLowerCase()
                  .includes(q)
              )
                rows.push({
                  ico,
                  title: r.name || r.title,
                  detail: label,
                  action: `editRecord('${kind}','${r.id}')`,
                });
        }
        $("search-results").innerHTML = rows.length
          ? rows
              .slice(0, 18)
              .map(
                (r) =>
                  `<button class="result-btn" onclick="${r.action}">${icon(r.ico)}<span>${esc(r.title)}<small>${r.detail}</small></span><span class="result-hint">Open</span></button>`,
              )
              .join("")
          : empty("No matches. Try a tool name, task or goal.");
      }

      // Assign unique label/control pairs separately for page forms and dialogs.
      function labelPlannerFields(root) {
        let index = 0;
        const scope = root.classList.contains("modal") ? "dialog" : "content";
        root.querySelectorAll(".field").forEach((f) => {
          const label = f.querySelector("label"),
            input = f.querySelector("input,select,textarea");
          if (label && input && !label.htmlFor) {
            if (!input.id) {
              let id;
              do {
                id = "planner-" + scope + "-" + index++;
              } while (document.getElementById(id));
              input.id = id;
            }
            label.htmlFor = input.id;
          }
        });
      }
      function prepareDialog() {
        const modal = $("modalroot").querySelector(".modal");
        if (!modal) return;
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        capitalizeUiLabels(modal);
        labelPlannerFields(modal);
        requestAnimationFrame(() => {
          if (modal.isConnected)
            (
              modal.querySelector("input:not([type=checkbox]),select,textarea") ||
              modal.querySelector("button")
            )?.focus();
        });
      }

      // Keyboard access: search shortcut, sidebar toggle, Escape dismissal and focus containment in dialogs.
      document.addEventListener("pointerdown", (e) => {
        if (!e.target.closest(".flyout,.rail-link[aria-haspopup]")) closeMenus();
      });
      document.addEventListener("keydown", (e) => {
        const editing = e.target.matches("input,textarea,select,[contenteditable=true]");
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
          return;
        }
        if (e.key === "Escape") {
          closeMenus();
          closeModal();
          return;
        }
        if (e.key === "[" && !editing) {
          e.preventDefault();
          toggleRail();
        }
        const modal = $("modalroot").querySelector(".modal");
        if (modal && e.key === "Tab") {
          const items = [
            ...modal.querySelectorAll(
              'button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex="0"]',
            ),
          ].filter((x) => x.getClientRects().length);
          const first = items[0],
            last = items.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            last?.focus();
            e.preventDefault();
          } else if (!e.shiftKey && document.activeElement === last) {
            first?.focus();
            e.preventDefault();
          }
        }
        if (modal && $("workspace-search") && ["ArrowDown", "ArrowUp"].includes(e.key)) {
          const items = [...$("search-results").querySelectorAll("button")];
          const pos = items.indexOf(document.activeElement);
          if (items.length) {
            e.preventDefault();
            items[(pos + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
          }
        }
        const fly = $("flyoutroot").firstElementChild;
        if (fly && ["ArrowDown", "ArrowUp"].includes(e.key)) {
          const buttons = [...fly.querySelectorAll("button")],
            pos = buttons.indexOf(document.activeElement);
          e.preventDefault();
          buttons[
            (pos + (e.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length
          ]?.focus();
        }
      });
      window.addEventListener("resize", () => {
        closeMenus();
        const active = $("nav").querySelector(".rail-link.active");
        if (active)
          $("nav").querySelector(".rail-pill").style.transform =
            `translateY(${active.offsetTop}px)`;
      });

      // Restore the sidebar preference, mount static icons and render the initial dashboard.
      function init() {
        try {
          document.body.classList.toggle(
            "rail-wide",
            localStorage.getItem("life_planner_rail") === "wide",
          );
        } catch {}
        const icons = {
          "brand-mark": "leaf",
          "rail-toggle": "panel",
          "settings-icon": "settings",
          "mobile-menu-icon": "menu",
          "crumb-chevron": "chevron",
          "search-icon": "search",
          "new-icon": "plus",
          "backup-tool": "download",
          "all-tools-button": "grid",
        };
        for (const [id, name] of Object.entries(icons)) $(id).innerHTML = icon(name);
        $("rail-toggle").setAttribute(
          "aria-expanded",
          String(document.body.classList.contains("rail-wide")),
        );
        render();
      }
      init();
    </script>
  </body>
</html>
